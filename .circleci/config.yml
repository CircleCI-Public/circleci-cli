version: 2.1

# CI for the LEGACY v0 CLI. Structurally modelled on main's config, but pared
# down to what v0 needs: static checks, tests, and a goreleaser deploy that
# publishes the `circleci@v0` Homebrew cask and the `CircleCI.CLI.V0` winget
# package. There are no docs, snap, chocolatey, packagecloud or cloudsmith jobs.
#
# NOTE: contexts (devex-release, macos-codesigning) and the deploy branch filter
# assume the v0 branch is the release branch for the legacy CLI in the shared
# CircleCI-Public/circleci-cli project — confirm before enabling deploys.

parameters:
  go_version_with_patch:
    type: string
    default: 1.26.4

commands:
  setup:
    steps:
      - checkout
      - install-go
      - install-task

  install-go:
    steps:
      - run: circleci run circleci/setup-go@0.0.10-5577d2a -- --version << pipeline.parameters.go_version_with_patch >> --go-cache-checksum '{{ checksum "go.sum" }}_{{ checksum "tools/go.sum" }}'
      - run: go version

  install-task:
    steps:
      - run:
          name: Install go-task
          command: |
            sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  store_results:
    steps:
      - store_test_results:
          path: ./test-reports

executors:
  linux:
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen3

jobs:
  check:
    executor: linux
    steps:
      - setup
      - run: task check

  test:
    executor: linux
    steps:
      - setup
      - run: task ci:test
      - store_results

  deploy:
    executor: linux
    parameters:
      publish_steps:
        type: steps
        default:
          - run: task ci:release
    steps:
      - setup
      - steps: << parameters.publish_steps >>
      - store_artifacts:
          path: dist

  ok-to-deploy:
    type: no-op

workflows:
  ci:
    jobs:
      - check
      - test

      # Every non-release branch dry-runs the full goreleaser pipeline (build +
      # cask + winget manifests) without tagging or publishing.
      - deploy:
          name: dry-run
          publish_steps:
            - run: task ci:build
          filters:
            branches:
              ignore:
                - v0

      - ok-to-deploy:
          requires:
            - check
            - test
          filters:
            branches:
              only: v0

      - deploy:
          serial-group: << pipeline.project.slug >>/deploy-v0
          requires:
            - ok-to-deploy
          context:
            - devex-release
            - macos-codesigning
