version: 2
jobs:
  builds:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
    - checkout
    - run:
        command: docker build -t x .
    - run:
        command: docker buildx build --platform linux/amd64,linux/arm64 -t x .
    - run:
        command: docker compose build
    - run:
        command: docker pull x && docker build .
    - run:
        name: Build
        command: |
          echo "starting"
          export TAG=${CIRCLE_SHA1}
          docker build -t app:$TAG .
  opaque:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
    - checkout
    - run:
        command: ./scripts/ci.sh
    - run:
        command: go test ./...
    - run:
        command: docker-compose up -d
    - run:
        command: go tool task ci:test
  job-shell:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    shell: pwsh
    steps:
    - run:
        command: .\build.ps1
  job-env:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    environment:
    - BASH_ENV: ./ci/bash-env
    - NODE_ENV: production
    steps:
    - run:
        command: echo harmless
  step-env:
    docker:
    - image: cimg/base:current
      environment:
        LD_PRELOAD: /tmp/x.so
    steps:
    - setup_remote_docker:
        docker_layer_caching: true
    - run:
        command: echo harmless
        environment:
          GOFLAGS: -toolexec=./ci/wrap
  remote:
    docker:
    - image: cimg/base:current
    steps:
    - checkout
    - setup_remote_docker:
        docker_layer_caching: true
    - run:
        command: docker pull alpine && docker images
  both:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
    - setup_remote_docker:
        docker_layer_caching: true
    - run:
        command: echo "no image here"
  parallel:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    parallelism: 4
    steps:
    - checkout
    - run:
        command: echo unit
  not-enabled:
    docker:
    - image: cimg/base:current
    steps:
    - checkout
    - setup_remote_docker
    - run:
        command: docker build .
workflows:
  ci:
    jobs:
    - builds
    - opaque
    - job-shell
    - job-env
    - step-env
    - remote
    - both
    - parallel
    - not-enabled
  version: 2
