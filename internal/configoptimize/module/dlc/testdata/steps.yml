version: 2.1
# One job per way a job's steps can read. No job shares anything with
# another, so each finding depends only on its own job.
jobs:
  builds:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
      - checkout
      - run: docker build -t x .
      - run: docker buildx build --platform linux/amd64,linux/arm64 -t x .
      - run: docker compose build
      - run: docker pull x && docker build .
      - run:
          name: Build
          command: |
            echo "starting"
            export TAG=${CIRCLE_SHA1}
            docker build -t app:$TAG .
  opaque:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
      - checkout
      - run: ./scripts/ci.sh
      - run: go test ./...
      - run: docker-compose up -d
      - run: go tool task ci:test
  job-shell:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    shell: pwsh
    steps:
      - run: .\build.ps1
  job-env:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    environment:
      BASH_ENV: ./ci/bash-env
      NODE_ENV: production
    steps:
      - run: echo harmless
  step-env:
    docker:
      - image: cimg/base:current
        environment:
          LD_PRELOAD: /tmp/x.so
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          command: echo harmless
          environment:
            GOFLAGS: -toolexec=./ci/wrap
  remote:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run: docker pull alpine && docker images
  both:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - run: echo "no image here"
  parallel:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    parallelism: 4
    steps: [checkout, {run: echo unit}]
  not-enabled:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run: docker build .
workflows:
  ci:
    jobs: [builds, opaque, job-shell, job-env, step-env, remote, both, parallel, not-enabled]
