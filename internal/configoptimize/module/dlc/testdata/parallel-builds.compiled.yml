version: 2
jobs:
  unit:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    parallelism: 4
    steps:
    - checkout
    - run:
        command: echo unit
  integration:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
    - checkout
    - run:
        command: echo integration
  lint:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
    - checkout
    - run:
        command: echo lint
