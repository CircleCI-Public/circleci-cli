version: 2.1
jobs:
  unit:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    parallelism: 4
    steps: [checkout, {run: echo unit}]
  integration:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps: [checkout, {run: echo integration}]
  lint:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps: [checkout, {run: echo lint}]
workflows:
  ci:
    jobs: [unit, integration, lint]
