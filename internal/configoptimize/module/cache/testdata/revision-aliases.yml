# Regression cases from the review of review-11 (D17). One job per case.
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:18.20

jobs:
  # The same revision under two names: consume restores what seed saves.
  sha-seed:
    executor: node
    steps:
      - save_cache:
          key: "sha-{{ .Environment.CIRCLE_SHA1 }}"
          paths: [/tmp/deps]
  sha-consume:
    executor: node
    steps:
      - restore_cache:
          keys: ["sha-{{ .Revision }}"]

  # Parallel nodes share the build number.
  parallel:
    executor: node
    parallelism: 2
    steps:
      - restore_cache:
          keys: ["par-{{ .BuildNum }}"]
      - save_cache:
          key: "par-{{ .BuildNum }}"
          paths: [/tmp/deps]

workflows:
  review11:
    jobs:
      - sha-seed
      - sha-consume: {requires: [sha-seed]}
      - parallel
