# Regression cases from the review of review-12 (D17). One job per case.
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:18.20

jobs:
  # {{ epoch }} differs between parallel nodes unless they save in the same
  # second: still a finding.
  parallel-epoch:
    executor: node
    parallelism: 2
    steps:
      - restore_cache:
          keys: ["pe-{{ epoch }}"]
      - save_cache:
          key: "pe-{{ epoch }}"
          paths: [/tmp/deps]

  # The save runs first, so the restore finds it.
  save-first:
    executor: node
    steps:
      - save_cache:
          key: "sf-{{ .BuildNum }}"
          paths: [/tmp/deps]
      - restore_cache:
          keys: ["sf-{{ .BuildNum }}"]

  # An earlier {{ epoch }} save has another key by the time the restore
  # runs: still a finding.
  save-first-epoch:
    executor: node
    steps:
      - save_cache:
          key: "se-{{ epoch }}"
          paths: [/tmp/deps]
      - run: sleep 2
      - restore_cache:
          keys: ["se-{{ epoch }}"]

workflows:
  review12:
    jobs: [parallel-epoch, save-first, save-first-epoch]
