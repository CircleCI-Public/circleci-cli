version: 2
jobs:
  cross-save:
    docker:
    - image: cimg/node:18.20
    steps:
    - run:
        command: npm ci
    - save_cache:
        key: shared-{{ checksum "package-lock.json" }}
        paths:
        - ~/.npm
  mixed-matrix-{{ epoch }}:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - mm-{{ epoch }}
    - run:
        command: npm ci
    - save_cache:
        key: mm-{{ epoch }}
        paths:
        - ~/.npm
  volatile-default-overridden:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - vd-{{ checksum "package-lock.json" }}
    - run:
        command: npm ci
    - save_cache:
        key: vd-{{ checksum "package-lock.json" }}
        paths:
        - ~/.npm
  function-run:
    docker:
    - image: cimg/node:18.20
    steps:
    - run:
        command: circleci run setup-go
    - run:
        command: go mod download
  broad-b:
    docker:
    - image: cimg/node:18.20
    steps:
    - run:
        command: npm ci
    - save_cache:
        key: v1-b-{{ checksum "b.lock" }}
        paths:
        - ~/.npm
  broad-restore:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - v1-{{ epoch }}
        - v1-
    - run:
        command: npm test
  matrixed-{{ .BuildNum }}:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - mx-{{ .BuildNum }}
    - run:
        command: npm ci
    - save_cache:
        key: mx-{{ .BuildNum }}
        paths:
        - ~/.npm
  keyed-volatile:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - keyed-{{ epoch }}
    - run:
        command: npm ci
    - save_cache:
        key: keyed-{{ epoch }}
        paths:
        - ~/.npm
  broad-a:
    docker:
    - image: cimg/node:18.20
    steps:
    - run:
        command: npm ci
    - save_cache:
        key: v1-a-{{ checksum "a.lock" }}
        paths:
        - ~/.npm
  cross-restore:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - shared-{{ checksum "package-lock.json" }}
    - run:
        command: npm test
  mixed-matrix-{{ checksum "package-lock.json" }}:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - mm-{{ checksum "package-lock.json" }}
    - run:
        command: npm ci
    - save_cache:
        key: mm-{{ checksum "package-lock.json" }}
        paths:
        - ~/.npm
  keyed-default:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - keyed-{{ checksum "package-lock.json" }}
    - run:
        command: npm ci
    - save_cache:
        key: keyed-{{ checksum "package-lock.json" }}
        paths:
        - ~/.npm
  matrixed-{{ epoch }}:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - mx-{{ epoch }}
    - run:
        command: npm ci
    - save_cache:
        key: mx-{{ epoch }}
        paths:
        - ~/.npm
  volatile-default-kept:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - vd-{{ epoch }}
    - run:
        command: npm ci
    - save_cache:
        key: vd-{{ epoch }}
        paths:
        - ~/.npm
  stable-fallback:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - npm-{{ .Revision }}
        - npm-
    - run:
        command: npm ci
    - save_cache:
        key: npm-{{ .Revision }}
        paths:
        - ~/.npm
  candidate:
    docker:
    - image: cimg/node:18.20
    steps:
    - checkout
    - run:
        command: npm ci
    - run:
        command: npm test
  untraceable:
    docker:
    - image: cimg/node:18.20
    steps:
    - restore_cache:
        keys:
        - ut-v1-{{ epoch }}
    - run:
        command: npm ci
    - save_cache:
        key: ut-v1-{{ epoch }}
        paths:
        - ~/.npm
workflows:
  focused:
    jobs:
    - stable-fallback
    - keyed-default
    - keyed-volatile
    - volatile-default-kept
    - volatile-default-overridden
    - matrixed-{{ epoch }}
    - matrixed-{{ .BuildNum }}
    - mixed-matrix-{{ epoch }}
    - mixed-matrix-{{ checksum "package-lock.json" }}
    - cross-save
    - cross-restore
    - untraceable
    - candidate
    - function-run
    - broad-a
    - broad-b
    - broad-restore
  version: 2
