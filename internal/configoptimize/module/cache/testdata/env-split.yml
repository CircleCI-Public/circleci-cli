# Regression cases from the review of review-8 (D17). One job per case.
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:18.20

jobs:
  env-split-quoted:
    executor: node
    steps:
      - run: env -S '"npm" "ci"'
  env-argv0:
    executor: node
    steps:
      - run: env --argv0 custom-name npm ci
  sudo-chroot:
    executor: node
    steps:
      - run: sudo --chroot /tmp npm ci
  mvn-color:
    executor: node
    steps:
      - run: mvn --color never
  # .BuildNum makes the key unique whatever {{ epoch }} does.
  epoch-and-buildnum:
    executor: node
    steps:
      - restore_cache:
          keys: ["eb-{{ .BuildNum }}-{{ epoch }}"]
      - save_cache:
          key: "eb-{{ .BuildNum }}-{{ epoch }}"
          paths: [/tmp/deps]

workflows:
  review8:
    jobs: [env-split-quoted, env-argv0, sudo-chroot, mvn-color, epoch-and-buildnum]
