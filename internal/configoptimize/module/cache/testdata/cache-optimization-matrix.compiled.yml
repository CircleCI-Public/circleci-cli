version: 2
jobs:
  serde-optimized:
    docker:
    - image: cimg/rust:1.75
    steps:
    - checkout
    - restore_cache:
        keys:
        - cargo-serde-{{ checksum "projects/serde/Cargo.toml" }}
    - run:
        name: Fetch dependencies (cargo)
        command: cd projects/serde && cargo fetch
    - save_cache:
        key: cargo-serde-{{ checksum "projects/serde/Cargo.toml" }}
        paths:
        - ~/.cargo/registry
  hugo-optimized:
    docker:
    - image: cimg/go:1.21
    steps:
    - checkout
    - restore_cache:
        keys:
        - v2-gomod-hugo-{{ checksum "projects/hugo/go.sum" }}
    - run:
        name: Download modules (go mod download)
        command: cd projects/hugo && go mod download
    - save_cache:
        key: v2-gomod-hugo-{{ checksum "projects/hugo/go.sum" }}
        paths:
        - ~/go/pkg/mod/cache/download
  hugo-baseline:
    docker:
    - image: cimg/go:1.21
    steps:
    - checkout
    - restore_cache:
        keys:
        - v2-gomod-hugo-{{ epoch }}
    - run:
        name: Download modules (go mod download)
        command: cd projects/hugo && go mod download
    - save_cache:
        key: v2-gomod-hugo-{{ epoch }}
        paths:
        - ~/go/pkg/mod/cache/download
  rxjs-baseline:
    docker:
    - image: cimg/node:18.20
    steps:
    - checkout
    - restore_cache:
        keys:
        - npm-rxjs-{{ epoch }}
    - run:
        name: Install dependencies (npm)
        command: cd projects/rxjs && npm ci --ignore-scripts
    - save_cache:
        key: npm-rxjs-{{ epoch }}
        paths:
        - ~/.cache/yarn
        - ~/.npm
  black-baseline:
    docker:
    - image: cimg/python:3.11
    steps:
    - checkout
    - restore_cache:
        keys:
        - pip-black-{{ epoch }}
    - run:
        name: Install dependencies (pip)
        command: cd projects/black && pip install --user -r requirements.txt
    - save_cache:
        key: pip-black-{{ epoch }}
        paths:
        - ~/.cache/pip
  gson-optimized:
    docker:
    - image: cimg/openjdk:17.0
    steps:
    - checkout
    - restore_cache:
        keys:
        - maven-gson-{{ checksum "projects/gson/pom.xml" }}
    - run:
        name: Resolve dependencies (maven)
        command: cd projects/gson && mvn -q -B dependency:resolve
    - save_cache:
        key: maven-gson-{{ checksum "projects/gson/pom.xml" }}
        paths:
        - ~/.m2/repository
  zod-baseline:
    docker:
    - image: cimg/node:18.20
