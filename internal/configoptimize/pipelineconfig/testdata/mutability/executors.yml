version: 2.1
executors:
  solo:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
  shared:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
jobs:
  alone:
    executor: solo
    steps: [checkout]
  first:
    executor: shared
    steps: [checkout]
  second:
    executor:
      name: shared
    steps: [checkout]
workflows:
  ci:
    jobs: [alone, first, second]
