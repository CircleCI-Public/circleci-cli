version: 2
jobs:
  build:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    steps:
    - checkout
    - run:
        command: make test
  remote:
    docker:
    - image: cimg/base:current
    steps:
    - checkout
    - setup_remote_docker:
        docker_layer_caching: true
    - run:
        command: make test
workflows:
  ci:
    jobs:
    - build
    - remote
  version: 2
