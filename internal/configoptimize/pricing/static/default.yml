# Built-in credit rates for config optimize: Docker gen1 classes, from CircleCI's
# public list as of 2026-08-31. Credits per minute and sizes are the same for
# every customer (a contract changes the price of a credit, not the rate).
# Override with --credit-rates FILE in the same format.
flat_charges:
  dlc: 200
credits_per_minute:
  - {platform: docker, class: small, generation: gen1, credits: 5}
  - {platform: docker, class: medium, generation: gen1, credits: 10}
  - {platform: docker, class: medium+, generation: gen1, credits: 15}
  - {platform: docker, class: large, generation: gen1, credits: 20}
  - {platform: docker, class: xlarge, generation: gen1, credits: 40}
  - {platform: docker, class: 2xlarge, generation: gen1, credits: 80}
  - {platform: docker, class: 2xlarge+, generation: gen1, credits: 100}
ladders:
  - {platform: docker, generation: gen1, classes: [small, medium, medium+, large, xlarge, 2xlarge, 2xlarge+]}
sizes:
  - {platform: docker, class: small, generation: gen1, vcpus: 1, ram_gb: 2}
  - {platform: docker, class: medium, generation: gen1, vcpus: 2, ram_gb: 4}
  - {platform: docker, class: medium+, generation: gen1, vcpus: 3, ram_gb: 6}
  - {platform: docker, class: large, generation: gen1, vcpus: 4, ram_gb: 8}
  - {platform: docker, class: xlarge, generation: gen1, vcpus: 8, ram_gb: 16}
  - {platform: docker, class: 2xlarge, generation: gen1, vcpus: 16, ram_gb: 32}
  - {platform: docker, class: 2xlarge+, generation: gen1, vcpus: 20, ram_gb: 40}
