version: '3'

vars:
  RESULTS_DIR: test-reports
  TEST_REPORT: test-reports/tests.xml
  LINT_REPORT: test-reports/lint.xml

  GH_NAME: 'circleci'
  GH_EMAIL: 'ops+deploy-bot@circleci.com'

tasks:
  build:
    desc: Build the circleci binary
    vars:
      DEST: '{{default "dist/circleci" .DEST}}'
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      DIRTY:
        sh: test -z "$(git status --porcelain 2>/dev/null)" || echo .dirty
      VERSION: '0.1.0-dev+{{.COMMIT}}{{.DIRTY}}'
    cmds:
      # v0's entry point is main.go at the repo root, and its version lives in the
      # version package (not main.version like on the v1 rewrite).
      - go build -ldflags="-X github.com/CircleCI-Public/circleci-cli/version.Version={{.VERSION}}" -o "{{.DEST}}" .

  release-check:
    desc: Check if the release is ready to be published
    cmds:
      - go tool -modfile tools/go.mod goreleaser check

  test:
    desc: Run unit tests
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod gotestsum -- -race -count=1 {{.ARGS}}

  check:
    desc: Run all static checks
    # v0's source predates the MIT-header convention, so — unlike main — there is
    # no license-header check here.
    cmds:
      - task: lint
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff
      - task: release-check

  fix:
    desc: Auto-fix static checks
    cmds:
      - task: fmt
      - task: mod-tidy
      - task: lint
        vars:
          CLI_ARGS: ./... --fix

  lint:
    desc: Run golangci-lint
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint run {{.ARGS}}

  fmt:
    desc: Format the code
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint fmt {{.ARGS}}

  mod-tidy:
    desc: Run 'go mod tidy'
    vars:
      ARGS: '{{default "-v" .CLI_ARGS}}'
    cmds:
      - go mod tidy {{.ARGS}}
      - go -C tools mod tidy {{.ARGS}}

  mod-download:
    desc: Run 'go mod download'
    cmds:
      - go mod download
      - go mod download -modfile tools/go.mod

  dev-install:
    desc: Build from source and install to ~/.local/bin
    vars:
      DEST: '${HOME}/.local/bin'
    cmds:
      - mkdir -p "{{.DEST}}"
      - task: build
        vars:
          DEST: '{{.DEST}}/circleci'

  generate:
    desc: Run go generate
    cmds:
      - go generate ./...

  # CI tasks

  ci:lint:
    desc: Lint with JUnit output
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - task: lint
        vars:
          CLI_ARGS: |
            ./... \
            --output.junit-xml.path "{{.LINT_REPORT}}" --output.junit-xml.extended \
            --output.text.path=stdout --output.text.colors=true

  ci:test:
    desc: Run tests with JUnit output
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - go tool -modfile tools/go.mod gotestsum --junitfile {{.TEST_REPORT}} -- -race -count=1 ./...

  ci:check:
    desc: Check no uncommitted diffs after generate/fmt/tidy
    cmds:
      - task: ci:lint
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff
      - task: release-check
      - task: generate
      - git diff --exit-code

  ci:release:
    desc: Tag, build, and publish a release (v0 Homebrew cask + winget)
    # v0 keeps its historical tag scheme (v0.1.<build-num>). Unlike main, there
    # are no nfpm/packagecloud/cloudsmith steps — v0 only publishes the cask and
    # winget package, both handled inside `goreleaser release`.
    vars:
      VERSION: 'v0.1.{{env "CIRCLE_BUILD_NUM" | default "0"}}'
    cmds:
      # Only set the deploy-bot identity in CI; never clobber a local git config.
      - |
        if [ -n "${CI:-}" ]; then
          git config --global user.email '{{.GH_EMAIL}}'
          git config --global user.name '{{.GH_NAME}}'
        fi
      - git tag -a '{{.VERSION}}' -m 'Release {{.VERSION}}'
      - git push origin '{{.VERSION}}'
      - go tool -modfile tools/go.mod goreleaser release --clean

  ci:build:
    desc: Dry-run a release — build a snapshot (cask + winget) without publishing
    vars:
      VERSION: 'v0.1.{{env "CIRCLE_BUILD_NUM" | default "0"}}'
    cmds:
      # Only set the deploy-bot identity in CI; never clobber a local git config.
      - |
        if [ -n "${CI:-}" ]; then
          git config --global user.email '{{.GH_EMAIL}}'
          git config --global user.name '{{.GH_NAME}}'
        fi
      - git tag -a '{{.VERSION}}' -m 'Release {{.VERSION}}'
      - go tool -modfile tools/go.mod goreleaser release --snapshot --clean
