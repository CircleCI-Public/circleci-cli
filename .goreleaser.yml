# Release config for the LEGACY v0 CLI, published from the `v0` branch.
#
# This modernises v0's packaging to the goreleaser v2 homebrew-cask + winget
# flow used on `main`, but it only publishes the two package managers that main
# does not already own for the legacy build: a `circleci@v0` Homebrew cask and a
# `CircleCI.CLI.V0` winget package. v0's historical nfpm/snap/chocolatey/docker
# outputs are intentionally NOT reproduced here.

version: 2

project_name: circleci-cli

before:
  hooks:
    # v0 has no `man` command and only ships bash + zsh completions (no fish or
    # PowerShell), so — unlike main — we generate just those two, into the same
    # UNIX-style share/ layout the cask and archives consume. v0's `completion`
    # subcommands write the script to stdout with no --output flag, so redirect;
    # mkdir first because the redirect will not create the parent directories.
    #
    # The binary installs as `circleci-v0` (see builds), so the completions are
    # named and rewritten to match: without this they would (a) collide with a
    # v1 install's `circleci` / `_circleci` files in the shared tap, and (b)
    # never fire, since the shell loads a completion by the command name it
    # declares. The global sed rewrites every `circleci` token consistently
    # (#compdef target, complete target, and internal function names).
    - sh -c 'mkdir -p share/bash-completion/completions share/zsh/site-functions'
    - sh -c 'go run . completion bash | sed "s/circleci/circleci-v0/g" > share/bash-completion/completions/circleci-v0'
    - sh -c 'go run . completion zsh | sed "s/circleci/circleci-v0/g" > share/zsh/site-functions/_circleci-v0'

builds:
  # Build as `circleci-v0` (not `circleci`) so the archive, the Homebrew cask,
  # and the winget package all install a binary that sits beside a v1 `circleci`
  # rather than clashing with it. GoReleaser's archive-based cask can only
  # symlink a binary under the name it has inside the archive, so the rename has
  # to happen here at build time — there is no cask-side `target:` rename.
  - binary: circleci-v0
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Preserve v0's established release ldflags exactly. The SegmentEndpoint is
    # deliberately left unset (as in v0's previous goreleaser config) so release
    # telemetry behaviour is unchanged from what v0 has always shipped.
    ldflags:
      - -s -w -X github.com/CircleCI-Public/circleci-cli/version.Version={{.Version}} -X github.com/CircleCI-Public/circleci-cli/version.Commit={{.ShortCommit}} -X github.com/CircleCI-Public/circleci-cli/version.packageManager=release

notarize:
  macos:
    - enabled: '{{ isEnvSet "QUILL_SIGN_P12" }}'
      sign:
        certificate: '{{ envOrDefault "QUILL_SIGN_P12" ""}}'
      notarize:
        issuer_id: '{{ envOrDefault "QUILL_NOTARY_ISSUER" ""}}'
        key_id: '{{ envOrDefault "QUILL_NOTARY_KEY_ID" ""}}'
        key: '{{ envOrDefault "QUILL_NOTARY_KEY" ""}}'

winget:
  - publisher: CircleCI
    name: CircleCI CLI (v0)
    short_description: "CircleCI command line tool (legacy v0)."
    description: |
      The legacy v0 build of CircleCI's official command line tool, published
      from the v0 branch for users who need the classic CLI. It installs as
      `circleci-v0` so it runs alongside the current `circleci`.
    license: "MIT"
    license_url: "https://github.com/CircleCI-Public/circleci-cli/blob/HEAD/LICENSE"
    tags:
      - circle-ci
      - circleci
      - cli
      - command-line-tool
      - continuous-delivery
      - continuous-integration
      - developer-tools
      - devops
      - golang
      - graphql
      - tool
    publisher_url: "https://github.com/CircleCI-Public"
    publisher_support_url: "https://github.com/CircleCI-Public/circleci-cli/issues/new"
    package_identifier: CircleCI.CLI.V0
    url_template: "https://github.com/CircleCI-Public/circleci-cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://circleci.com"
    copyright: "Circle Internet Services, Inc."
    release_notes: "{{.Changelog}}"
    release_notes_url: "https://github.com/CircleCI-Public/circleci-cli/releases/tag/{{ .Tag }}"
    repository:
      owner: CircleCI-Public
      name: winget-pkgs
      branch: "circleci-cli-v0-{{ .Tag }}"
      pull_request:
        enabled: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

homebrew_casks:
  # The legacy v0 CLI as a Homebrew cask, published to the same tap that carries
  # the `circleci@next` preview cask from main. It installs the binary as
  # `circleci-v0`, so — unlike main's cask — it coexists with the homebrew-core
  # `circleci` formula and the `circleci@next` cask instead of clashing with
  # them. No `brew unlink` dance is required.
  - name: circleci@v0
    directory: Casks
    repository:
      owner: CircleCI-Public
      name: homebrew-circleci
      branch: main
    homepage: "https://circleci.com"
    description: "CircleCI command line tool (legacy v0)."
    binaries:
      - circleci-v0
    completions:
      bash: share/bash-completion/completions/circleci-v0
      zsh: share/zsh/site-functions/_circleci-v0
    caveats: |
      This installs the legacy v0 CLI as `circleci-v0`, so it runs alongside the
      current `circleci` (the homebrew-core formula or the `circleci@next`
      cask). Invoke the legacy CLI as `circleci-v0`.

archives:
  - files:
      - LICENSE
      - src: ./share/bash-completion/completions/circleci-v0
        dst: share/bash-completion/completions/circleci-v0
      - src: ./share/zsh/site-functions/_circleci-v0
        dst: share/zsh/site-functions/_circleci-v0
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  prerelease: auto
  name_template: "CircleCI CLI (v0) {{.Version}}"
  # NEVER mark a v0 release as "latest": main and v0 publish to the same GitHub
  # repo, and homebrew-core's autobump bot pulls /releases/latest — marking a v0
  # build latest would regress the stable install to the legacy CLI.
  make_latest: false
